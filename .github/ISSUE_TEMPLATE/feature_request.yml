name: Feature request
description: Suggest an improvement to the Launchpad site, a kit, or the documentation
labels: ["enhancement", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting an idea. For a new kit, include the checklist items from "Adding or changing a kit" in CONTRIBUTING.md. Keep examples fictional and never include real credentials.
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe the learner or maintainer problem, not only the solution.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What would you like to see?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Website (pages, navigation, layout)
        - Kit demo or kit content
        - Documentation
        - Build or deployment
        - Other
    validations:
      required: true
  - type: checkboxes
    id: scope
    attributes:
      label: Scope check
      options:
        - label: This keeps Launchpad mock-only and dry-run. It does not connect to a bank or ask for credentials.
          required: true
