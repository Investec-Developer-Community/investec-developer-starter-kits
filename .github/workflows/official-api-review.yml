name: Official API review

on:
  schedule:
    - cron: '23 7 * * 1' # Mondays, 07:23 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: official-api-review-${{ github.ref }}
  cancel-in-progress: false

jobs:
  review:
    name: Read-only official contract review
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
        with:
          version: 10.26.1
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - name: Install review dependencies
        run: pnpm install --frozen-lockfile --filter @workspace/scripts
      - name: Verify review safety and CI reporting offline
        run: |
          pnpm test:api-review
          node --test scripts/ci-review-api.test.mjs
      - name: Compare official contracts (never approve)
        run: node scripts/ci-review-api.mjs
      - name: Retain review evidence even when review fails
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: official-api-review-${{ github.run_id }}-${{ github.run_attempt }}
          path: generated-artifacts/official-api-review/
          retention-days: 30
          if-no-files-found: warn
