name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      update_snapshots:
        description: Regenerate responsive screenshot baselines in the pinned Playwright container (uploaded as an artifact, never committed)
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    name: Workspace typecheck
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck workspace
        run: pnpm run typecheck

  unit-tests:
    name: Unit and maintenance tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      # python3 (ZIP extraction in starter-bundle, kits and learning-kits tests) ships with ubuntu-24.04.
      - name: Confirm python3 for ZIP checks
        run: python3 --version
      # Globs every src/maintenance/**/*.test.{ts,mjs} file, plus the CI review adapter test.
      - name: Run offline maintenance suites (blocking)
        run: pnpm --filter @workspace/starter-kits test:unit
      - name: Check social metadata and image delivery
        run: pnpm --filter @workspace/starter-kits test:social

  build:
    name: Starter-kits build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs:
      - typecheck
      - unit-tests
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build starter-kits static site (base /)
        run: pnpm --filter @workspace/starter-kits build
      - name: Build starter-kits static site (repository subpath)
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
        run: pnpm --filter @workspace/starter-kits build --outDir ../../generated-artifacts/ci-subpath-build

  responsive:
    name: Responsive and keyboard regressions
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    # Pinned to the @playwright/test version resolved in pnpm-lock.yaml so browsers and
    # fonts match the committed screenshot baselines. Bump both together.
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
    env:
      HOME: /root
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run responsive tests
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.update_snapshots }}" = "true" ]; then
            pnpm --filter @workspace/starter-kits test:responsive:update
          else
            pnpm --filter @workspace/starter-kits test:responsive
          fi
      - name: Upload responsive report on failure
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: responsive-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            generated-artifacts/responsive/report
            generated-artifacts/responsive/results
          retention-days: 14
          if-no-files-found: warn
      - name: Upload refreshed responsive baselines
        if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' && inputs.update_snapshots == true }}
        uses: actions/upload-artifact@v7
        with:
          name: responsive-baselines-ubuntu-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/starter-kits/tests/responsive/baselines
          retention-days: 14
          if-no-files-found: error
