name: Starter kits static hosting

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: static-hosting-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  static-hosting:
    name: Static routes and base paths
    # Standard Ubuntu runners are Linux x64, matching the workspace lockfile.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install frontend and root test-tool dependencies
        run: pnpm install --frozen-lockfile --filter workspace --filter @workspace/starter-kits... --filter @workspace/scripts
      - name: Check offline teaching calculations and extracted starters
        run: pnpm --filter @workspace/scripts test:learning-kits
      - name: Check social metadata and image delivery
        run: pnpm --filter @workspace/starter-kits test:social
      - name: Install Chromium and Linux dependencies
        run: pnpm --filter @workspace/starter-kits exec playwright install --with-deps chromium
      - name: Check static routes and base paths
        run: pnpm --filter @workspace/starter-kits test:static
